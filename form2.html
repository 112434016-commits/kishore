<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 420px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #999;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .radio-group {
            margin-top: 5px;
        }

        .radio-group input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <form>

        <!-- Name -->
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <!-- Email -->
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <!-- Password -->
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <!-- Textarea -->
        <label for="address">Address</label>
        <textarea id="address" rows="4" placeholder="Enter your address"></textarea>

        <!-- Combobox -->
        <label for="course">Course (Combo Box)</label>
        <select id="course">
            <option>Select Course</option>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>B.Com</option>
            <option>B.Tech</option>
            <option>MCA</option>
        </select>

        <!-- Listbox -->
        <label for="skills">Skills (List Box)</label>
        <select id="skills" multiple size="4">
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>Python</option>
            <option>Java</option>
        </select>

        <!-- Radio Buttons -->
        <label>Gender</label>
        <div class="radio-group">
            <input type="radio" id="male" name="gender">
            <label for="male" style="display:inline;">Male</label>

            <input type="radio" id="female" name="gender">
            <label for="female" style="display:inline;">Female</label>

            <input type="radio" id="other" name="gender">
            <label for="other" style="display:inline;">Other</label>
        </div>

        <!-- Color Picker -->
        <label for="color">Favorite Color</label>
        <input type="color" id="color">

        <!-- Button -->
        <button type="submit">Submit</button>

    </form>
</div>

</body>
</html>
